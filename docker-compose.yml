  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: tenanthub_cadvisor
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
